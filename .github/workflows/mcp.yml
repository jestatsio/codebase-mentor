name: MCP

on:
  pull_request:
    paths: ["mcp/**", "core/**", "template/**", "scripts/sync-adapters.sh", ".github/workflows/mcp.yml"]
  push:
    branches: [main]
    paths: ["mcp/**", "core/**", "template/**", "scripts/sync-adapters.sh", ".github/workflows/mcp.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
